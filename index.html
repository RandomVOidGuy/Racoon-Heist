<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b1026" />
  <title>Racoon Heist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦝</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0b1026;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-canvas { display: block; width: 100%; height: 100%; }

    /* Title screen */
    #title-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      background: radial-gradient(ellipse at 50% 30%, #1b2350 0%, #0b1026 70%);
      color: #f5ecd7;
      text-align: center;
      z-index: 10;
      transition: opacity 0.6s ease;
    }
    #title-screen.hidden { opacity: 0; pointer-events: none; }
    #title-screen h1 {
      font-size: clamp(2.2rem, 9vw, 4.5rem);
      letter-spacing: 0.04em;
      text-shadow: 0 4px 24px rgba(255, 214, 90, 0.35);
    }
    #title-screen .moon {
      font-size: clamp(3rem, 12vw, 5rem);
      filter: drop-shadow(0 0 30px rgba(245, 236, 215, 0.6));
    }
    #title-screen p.tagline {
      max-width: 26rem;
      padding: 0 1.5rem;
      line-height: 1.5;
      color: #c9c2ae;
    }
    #start-button {
      margin-top: 0.5rem;
      padding: 0.9rem 2.6rem;
      font-size: 1.15rem;
      font-family: inherit;
      color: #0b1026;
      background: #ffd65a;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b8912a;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    #start-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b8912a;
    }

    /* HUD */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1rem;
      color: #f5ecd7;
      font-size: 1rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 5;
    }
    body.playing #hud { display: flex; }

    #alert-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 0 0 auto;
    }
    #alert-bar {
      width: 6rem; height: 0.6rem;
      border-radius: 999px;
      background: rgba(245, 236, 215, 0.15);
      overflow: hidden;
    }
    #alert-fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #ffd65a, #ff4444);
      transition: width 0.1s linear;
    }

    /* Danger vignette when a camera is spotting you */
    #vignette {
      position: fixed; inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 18vmin 4vmin rgba(255, 40, 40, 0.55);
      opacity: 0;
      z-index: 4;
    }

    /* End screens (busted / escaped) */
    #end-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      background: rgba(11, 16, 38, 0.85);
      color: #f5ecd7;
      text-align: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #end-screen.show { opacity: 1; pointer-events: auto; }
    #end-screen h1 { font-size: clamp(2rem, 8vw, 3.8rem); letter-spacing: 0.04em; }
    #end-screen p { max-width: 26rem; padding: 0 1.5rem; line-height: 1.5; color: #c9c2ae; }
    #end-screen .big { font-size: clamp(2.5rem, 10vw, 4rem); }
    #restart-button {
      padding: 0.9rem 2.6rem;
      font-size: 1.15rem;
      font-family: inherit;
      color: #0b1026;
      background: #ffd65a;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b8912a;
    }
    #restart-button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8912a; }

    /* Touch joystick */
    #joystick {
      position: fixed;
      bottom: 5.5rem; left: 3.5rem;
      width: 7rem; height: 7rem;
      display: none;
      border-radius: 50%;
      background: rgba(245, 236, 215, 0.08);
      border: 2px solid rgba(245, 236, 215, 0.25);
      z-index: 5;
    }
    #joystick .nub {
      position: absolute;
      top: 50%; left: 50%;
      width: 3rem; height: 3rem;
      border-radius: 50%;
      background: rgba(245, 236, 215, 0.35);
      transform: translate(-50%, -50%);
    }
    body.playing.touch #joystick { display: block; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="title-screen">
    <div class="moon">🌕</div>
    <h1>RACOON HEIST</h1>
    <p class="tagline">The museum sleeps. The Golden Sardine glitters in its case. Time to get sneaky.</p>
    <button id="start-button" type="button">Start the Heist</button>
  </div>

  <div id="hud">
    <span id="hud-objective">Steal the Golden Sardine</span>
    <div id="alert-wrap">
      <span>👁</span>
      <div id="alert-bar"><div id="alert-fill"></div></div>
    </div>
    <span id="hud-loot">🐟 0</span>
  </div>

  <div id="vignette"></div>

  <div id="end-screen">
    <div class="big" id="end-emoji">🚨</div>
    <h1 id="end-title">BUSTED!</h1>
    <p id="end-text"></p>
    <button id="restart-button" type="button">Try Again</button>
  </div>

  <div id="joystick"><div class="nub"></div></div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
